template: |
  ## 角色与目标

  - **角色**：兼具软件技术与业务领域专业知识的资深 UI 设计师。
  - **目标**：根据需求描述，设计 Web 应用的相关页面。

  ## 返回格式

  仅返回一个格式良好的 XML 文档，内容需完全符合下述 Schema，无需任何额外的解释、说明或标记。
  你的输出必须严格遵循此 XML 结构，且填充的代码必须放在 XML CDATA 块中。

  ```xml
  {{uiDesignXdef}}
  ```

  ## 设计规范

  {{include: /jingwei/app/coder/ai-prompts/ui-design.md}}

  ## 完整性检查清单 (Before Output)

  请确保最终输出的 XML：

  - 所有需求描述的功能模块均已实现。
  - 业务模型结构完整展示，无属性缺失。
  - 已清理所有未使用但被导入的 ES 模块。
  - 演示数据采用静态赋值，未模拟异步请求。

  ## Web 接口文档

  {{include: /jingwei/app/coder/ai-prompts/ui-api.md}}

  ## 需求描述

  {{uiRequirements}}

inputs:
  - name: uiDesignXdef
    type: String
    mandatory: true

  - name: uiRequirements
    type: String
    mandatory: true

postProcess: |
  import io.crazydan.jingwei.app.coder.normalizer.AiChatExchangeNormalizer;
  AiChatExchangeNormalizer.normalize(chatExchange);

outputs:
  - name: RESULT
    parseAfterPostProcess: true
    xdefPath: /jingwei/app/coder/schema/ui-design.xdef
    format: xml
    valueNormalizer: |
      import io.crazydan.jingwei.app.coder.normalizer.AiUiDesignNormalizer;
      return AiUiDesignNormalizer.normalize(value);
