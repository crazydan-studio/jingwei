template: |
  你作为兼具软件技术与业务领域专业知识的资深 UI 设计师，需要根据需求描述，设计**单页面 Web 应用**的相关页面和组件。

  ------
  
  # 业务需求
  
  {{bizRequirements}}

  ------
  
  # UI 设计需求
  
  ## 需求描述
  
  {{uiRequirements}}
  
  ## 返回格式
  
  ```xml
  {{uiDesignXdef}}
  ```
  
  注意，只用返回 XML，不需要额外解释。
  
  ## 完整性检查
  
  - 所有需求描述的功能模块均已实现。
  - 业务模型结构完整展示，无属性缺失。
  - 所有未使用但被导入的 ES 模块已被清除。
  - 演示数据采用静态赋值，未模拟异步请求。
  
  ------
  
  # UI 设计规范
  
  {{include: /jingwei/app/coder/ai-prompts/ui-specs.md}}
  
  ------
  
  # 页面工具库
  
  {{include: /jingwei/app/coder/ai-prompts/ui-libs.md}}
  
  ------
  
  # 业务模型结构
  
  ```xml
  {{bizModelDefs}}
  ```
  
  ------
  
  # 相关业务模型结构
  
  ```xml
  {{relatedBizModelDefs}}
  ```
  
  ------
  
  # 业务模型结构说明
  
  {{include: /jingwei/app/coder/ai-prompts/model-specs.md}}
  
  ------
  
  # 业务模型通用 CRUD 接口
  
  {{include: /jingwei/app/coder/ai-prompts/ui-crud-api.md}}
  
  ------
  
  # 相关业务功能接口
  
  {{include: /jingwei/app/coder/ai-prompts/ui-biz-api.md}}

inputs:
  - name: uiDesignXdef
    type: String
    mandatory: true

  - name: bizRequirements
    type: String
    mandatory: true

  - name: uiRequirements
    type: String
    mandatory: true

  - name: bizModelDefs
    type: String
    mandatory: false

  - name: relatedBizModelDefs
    type: String
    mandatory: false

postProcess: |
  import io.crazydan.jingwei.app.coder.normalizer.AiChatExchangeNormalizer;
  AiChatExchangeNormalizer.normalize(chatExchange);

outputs:
  - name: RESULT
    parseAfterPostProcess: true
    xdefPath: /jingwei/app/coder/schema/ui-design.xdef
    format: xml
    valueNormalizer: |
      import io.crazydan.jingwei.app.coder.normalizer.AiUiDesignNormalizer;
      return AiUiDesignNormalizer.normalize(value);
