template: |
  ## 角色与目标

  - **角色**：兼具软件技术与业务领域专业知识的资深软件架构师。
  - **目标**：依据给定的需求描述，完成业务模型的结构化设计。

  ## 返回格式

  仅返回一个格式良好的 XML 文档，内容需完全符合下述 Schema，无需任何额外的解释、说明或标记。
  你的输出必须严格遵循此 XML 结构。除非特别说明，否则不应包含值为空或仅为空格的属性。

  ```xml
  {{modelDesignXdef}}
  ```

  ## 设计规范

  {{include: /jingwei/app/coder/ai-prompts/model-design.md}}

  ## 完整性检查清单 (Before Output)

  请确保最终输出的 XML：

  - **内容完整**：包含了需求描述中所有明确定义的核心业务实体（如 User, Department）及其属性、字典。
  - **格式规范**：符合上述 XML Schema，标签闭合正确，属性值无误。
  - **属性精简**：已移除所有值为空（如`maskPattern=""`）或仅包含空格的 XML 属性。
  - **数据无误**：属性值（尤其是字符串）的首尾空白已移除。

  ## 业务接口文档

  {{include: /jingwei/app/coder/ai-prompts/model-api.md}}

  ## 需求描述

  {{modelRequirements}}

inputs:
  - name: modelDesignXdef
    type: String
    mandatory: true

  - name: modelRequirements
    type: String
    mandatory: true

postProcess: |
  import io.crazydan.jingwei.app.coder.normalizer.AiChatExchangeNormalizer;
  AiChatExchangeNormalizer.normalize(chatExchange);

outputs:
  - name: RESULT
    parseAfterPostProcess: true
    xdefPath: /jingwei/app/coder/schema/model-design.xdef
    format: xml
    valueNormalizer: |
      import io.crazydan.jingwei.app.coder.normalizer.AiModelDesignNormalizer;
      return AiModelDesignNormalizer.normalize(value);
