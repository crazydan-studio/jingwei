# 编写 AI 提示词需注意：
# - 不能使用内嵌代码标记符，即一对反引号，AI 不能识别该标记。代码块可正常使用
# - 需要强调的内容使用加粗标记符，即一对双星号
# - 通过命令式加粗词汇要求 AI 不做什么，如 **禁止**、**不要**
template: |
  【任务目标】
  
  你作为兼具软件技术与业务领域专业知识的资深软件架构师，需要依据给定需求描述完成业务模型的结构设计。
  只用返回 XML，不需要额外解释。
  
  【返回格式】
  
  ```xml
  {{_promptModel.xdefForResult}}
  ```
  
  【设计规范】
  
  {{include: /jingwei/app/coder/ai-prompts/model-design.md}}
  
  【完整性检查】
  
  - 返回的 XML 包含所有业务模型定义，没有缺失
  - 移除值为空的 XML 标签属性
  - 移除 XML 标签属性值中的首尾空白
  
  【需求描述 - 系统设计】
  
  {{sysRequirements}}
  
  【需求描述 - 模型设计】
  
  {{modelRequirements}}

inputs:
  - name: sysRequirements
    type: String
    mandatory: true
  - name: modelRequirements
    type: String
    mandatory: true

outputs:
  - name: RESULT
    xdefPath: /jingwei/app/schema/coder/model-design.xdef
    format: xml
    outputBuilder: |
      import io.crazydan.jingwei.app.coder.normalizer.AiModelDesignNormalizer;
      return AiModelDesignNormalizer.normalize(value);
