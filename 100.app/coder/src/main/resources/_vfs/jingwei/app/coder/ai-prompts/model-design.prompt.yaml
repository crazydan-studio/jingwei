template: |
  你作为兼具软件技术与业务领域专业知识的资深软件架构师，需要依据给定的需求描述，完成业务模型的结构化设计。
  
  ------
  
  # 模型设计要求
  
  ## 需求描述
  
  {{modelRequirements}}
  
  ## 返回格式
  
  ```xml
  {{modelDesignXdef}}
  ```
  
  注意，只用返回XML，不需要额外解释。
  
  ## 完整性检查
  
  - 包含了需求描述中所有明确定义的核心业务实体及其属性、字典。
  - 符合上述 XML Schema，标签闭合正确，属性值无误。
  - 已移除所有值为空（如 `maskPattern=""`）或仅包含空格的 XML 属性。
  - 属性值（尤其是字符串）的首尾空白已移除。
  
  ------
  
  # 模型设计规范
  
  ## 核心原则

  - **设计范围**：聚焦于需求中描述的核心业务实体 (如 App, AppVersion)。排除通用模型 (如 User, Role, Permission 等)。
  - **实体命名**：所有实体名均以 Entity 为后缀，如 AppEntity、AppVersionEntity。
  - 在描述、显示名称等文本中，中文与英文、数字之间**必须添加空格**，但中文标点与英文、数字之间**不能加空格**。
    如 `这是一个示例 example 123。`
            
  {{include: /jingwei/app/coder/ai-prompts/model-specs.md}}
  
  ------
  
  # 模型函数库
  
  {{include: /jingwei/app/coder/ai-prompts/model-libs.md}}

inputs:
  - name: modelDesignXdef
    type: String
    mandatory: true

  - name: modelRequirements
    type: String
    mandatory: true

postProcess: |
  import io.crazydan.jingwei.app.coder.normalizer.AiChatExchangeNormalizer;
  AiChatExchangeNormalizer.normalize(chatExchange);

outputs:
  - name: RESULT
    parseAfterPostProcess: true
    xdefPath: /jingwei/app/coder/schema/model-design.xdef
    format: xml
    valueNormalizer: |
      import io.crazydan.jingwei.app.coder.normalizer.AiModelDesignNormalizer;
      return AiModelDesignNormalizer.normalize(value);
