nop:
  debug: true

  vfs:
    custom:
      ns-mappings: |
        app-install-dir:${jingwei.app.install-dir},
        app-static-dir:${jingwei.app.static-dir}
  ai:
    service:
      # LLM引擎执行时是否自动打印所有请求和响应消息
      log-message: true
      # 禁止日志输出到文件
      log-dir: none
      # 是否启用系统提示词
      enable-work-mode-system-prompt: true

jingwei:
  app:
    static-dir: ${project.build.outputDirectory}/../app-pages
    install-dir: ${project.build.outputDirectory}/../app-installed
