# 编写 AI 提示词需注意：
# - 不能使用内嵌代码标记符，即一对反引号，AI 不能识别该标记。代码块可正常使用
# - 需要强调的内容使用加粗标记符，即一对双星号
# - 通过命令式加粗词汇要求 AI 不做什么，如 **禁止**、**不要**
template: |
  【任务描述】
  
  你作为兼具软件技术与业务领域专业知识的资深 UI 设计师，需要根据需求描述设计 Web 应用的相关页面。
  只用返回 XML，不需要额外解释。
  
  【返回格式】
  
  ```xml
  {{_promptModel.xdefForResult}}
  ```
  
  【设计规范】
  
  {{include: /jingwei/ai/prompts/coder/ui-design.md}}
  
  【完整性检查】
  
  - 包含完整的功能模块，所涉及的模型结构完整展示，没有缺失
  - 清理未使用但被导入的 ES 模块
  
  【业务模型】
  
  {{modelDefinitions}}
  
  【需求描述 - 系统设计】
  
  {{sysRequirements}}
  
  【需求描述 - UI 设计】
  
  {{uiRequirements}}

inputs:
  - name: modelDefinitions
    type: String
    mandatory: true
  - name: sysRequirements
    type: String
    mandatory: true
  - name: uiRequirements
    type: String
    mandatory: true

outputs:
  - name: RESULT
    xdefPath: /jingwei/ai/schema/coder/ui-design.xdef
    format: xml
    outputBuilder: |
      import io.crazydan.jingwei.ai.AiErdModelNormalizer;
      return AiErdModelNormalizer.normalize(value);
