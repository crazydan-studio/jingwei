<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <title>精卫 - 您的个人数字资产平台</title>

    <script>
      window.__global_app_config__ = {
        // 应用挂载容器的 id
        containerId: 'main-app',
        // 接口配置信息
        api: {
          static: '${staticContextRoot}',
          graphql: '${apiContextRoot}/graphql',
          fileUpload: '${apiContextRoot}/f/upload'
        }
      };
    </script>

    <style>
      /** [现代 CSS 解决方案：Modern CSS Reset](https://www.cnblogs.com/coco1s/p/16143423.html)
      * https://github.com/Andy-set-studio/modern-css-reset/blob/master/dist/reset.min.css */
      *,*::before,*::after{box-sizing:border-box}body,h1,h2,h3,h4,p,figure,blockquote,dl,dd{margin:0}ul[role="list"],ol[role="list"]{list-style:none}html:focus-within{scroll-behavior:smooth}body{min-height:100vh;text-rendering:optimizeSpeed;line-height:1.5}a:not([class]){text-decoration-skip-ink:auto}img,picture{max-width:100%;display:block}input,button,textarea,select{font:inherit}@media(prefers-reduced-motion:reduce){html:focus-within{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
      /** 补充 reset 样式 */
      input,button,textarea,select{margin:0;padding:0}

      html,
      body,
      #main {
        min-width: 100dvw;
        min-height: 100dvh;
      }

      .loading {
        --spinner-text: '';
        --spinner-size: 10rem;
        --spinner-image: url('${staticContextRoot}/loading.svg');
      }

      .loading::before,
      .loading::after {
        opacity: 1;
        transition: opacity 0.5s ease-out;
        transition-delay: 0.2s;
        pointer-events: none;

        overflow: hidden;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
      }

      .loading::before {
        z-index: 10001;
        top: var(--spinner-size);

        display: flex;
        justify-content: center;
        align-items: center;

        content: var(--spinner-text);
        font-size: 1.5em;
        color: #0099e5;
      }
      .loading::after {
        z-index: 10000;
        top: 0;

        content: '';
        background-image: var(--spinner-image);
        background-color: #fff;
        background-position: center;
        background-size: var(--spinner-size);
        background-repeat: no-repeat;
      }

      .loading.done::before,
      .loading.done::after {
        opacity: 0;
      }

      .loading > * {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      .loading.done > * {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="main" class="loading"></div>

    <script defer src="${staticContextRoot}/assets/vue.min.js"></script>
    <script defer src="${staticContextRoot}/assets/naive-ui.min.js"></script>
    <script defer src="${staticContextRoot}/assets/tailwindcss.min.js"></script>
    <script defer src="${staticContextRoot}/assets/highlightjs.min.js"></script>

    <script defer src="${staticContextRoot}/utils.js"></script>
    <script defer src="${staticContextRoot}/main.js"></script>

    <link
      rel="stylesheet"
      href="${staticContextRoot}/assets/highlightjs/atom-one-light.min.css"
    />
  </body>
</html>
