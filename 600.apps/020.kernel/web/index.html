<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <title>精卫 - 您的个人数字资产平台</title>

    <script>
      window.__global_app_config__ = {
        // 应用挂载容器的 id
        containerId: 'main-app',
        // 门户应用的标识
        protalCode: '${portalCode}',
        // 接口配置信息
        api: {
          static: '${staticContextRoot}',
          graphql: '${apiContextRoot}/graphql',
          fileUpload: '${apiContextRoot}/f/upload'
        }
      };
    </script>

    <style>
      html,
      body,
      #main {
        min-width: 100dvw;
        min-height: 100dvh;
        overflow: hidden;
      }

      .loading {
        min-width: 100%;
        min-height: 100%;
        --spinner-text: '';
        --spinner-size: 10rem;
        --spinner-image: url('${staticContextRoot}/loading.svg');
      }

      .loading::before,
      .loading::after {
        opacity: 1;
        transition: opacity 0.5s ease-out;
        transition-delay: 0.2s;
        pointer-events: none;

        overflow: hidden;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
      }

      .loading::before {
        z-index: 10001;
        top: var(--spinner-size);

        display: flex;
        justify-content: center;
        align-items: center;

        content: var(--spinner-text);
        font-size: 1.5em;
        color: #0099e5;
      }
      .loading::after {
        z-index: 10000;
        top: 0;

        content: '';
        background-image: var(--spinner-image);
        background-color: #fff;
        background-position: center;
        background-size: var(--spinner-size);
        background-repeat: no-repeat;
      }

      .loading.done::before,
      .loading.done::after {
        opacity: 0;
      }

      .loading > * {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      .loading.done > * {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="main" class="loading"></div>

    <script defer src="${staticContextRoot}/assets/vue.min.js"></script>
    <script defer src="${staticContextRoot}/assets/naive-ui.min.js"></script>
    <script defer src="${staticContextRoot}/assets/tailwindcss.min.js"></script>
    <script defer src="${staticContextRoot}/assets/highlightjs.min.js"></script>

    <script defer src="${staticContextRoot}/utils.js"></script>
    <script defer src="${staticContextRoot}/main.js"></script>

    <link
      rel="stylesheet"
      href="${staticContextRoot}/assets/highlightjs/atom-one-light.min.css"
    />
  </body>
</html>
