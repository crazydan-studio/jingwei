nop:
  # Note: 正式环境需禁用调试
  debug: false
  graphql:
    schema-introspection:
      enabled: false

  orm:
    init-database-schema: true
    enable-tenant-by-default: false
    auto-add-tenant-col: false

  datasource:
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # jdbc-url: jdbc:mysql://127.0.0.1:3306/dev?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=UTC
    # username: nop
    # password: nop-test
    metrics-enabled: true
    driver-class-name: org.h2.Driver
    jdbc-url: jdbc:h2:${jingwei.data-dir}/local
    username: sa
    password:

  gateway:
    http-filter:
      enabled: true

  file:
    #store-impl: oss
    store-dir: ${jingwei.data-dir}/files

  extension:
    undertow:
      server:
        port: 8181
        static-dir: ${jingwei.app.static-dir}
        compression:
          enabled: true
          # min-response-size: 2048
          mime-types: text/html,text/xml,text/plain,text/javascript,text/css,application/json,application/xml,application/javascript,application/x-shockwave-flash

  vfs:
    custom:
      ns-mappings: |
        app-install-dir:${jingwei.app.install-dir},
        app-static-dir:${jingwei.app.static-dir}

duzhou:
  cli:
    pnpm:
      path: /usr/bin/pnpm

jingwei:
  data-dir: ./_data
  app:
    portal-code: ae9c6b146f93436abba7761593058f38
    static-dir: ${jingwei.data-dir}/app-pages
    install-dir: ${jingwei.data-dir}/app-installed
